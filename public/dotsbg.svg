<svg width="10" height="10" xmlns="http://www.w3.org/2000/svg" class="m-0">
  <style type="text/css">
    .dot {fill: #00000055;}
  </style>
  <pattern id="dots" patternUnits="userSpaceOnUse" width="10" height="10">
    <g>
      <!-- <circle cx="5" cy="0" r="2"  class="dot"/>
      <circle cx="5" cy="10" r="2"  class="dot"/>
      <circle cx="0" cy="5" r="2"  class="dot"/>
      <circle cx="10" cy="5" r="2"  class="dot"/> -->

      <rect x="5" y="0" width="2" height="2" transform="rotate(45 6 1)" class="dot"/>
      <rect x="5" y="10" width="2" height="2" transform="rotate(45 6 11)" class="dot"/>
      <rect x="0" y="5" width="2" height="2" transform="rotate(45 1 6)" class="dot"/>
      <rect x="10" y="5" width="2" height="2" transform="rotate(45 11 6)" class="dot"/>

      <!-- <circle cx="15" cy="0" r="2"  class="dot"/>
      <circle cx="15" cy="10" r="2"  class="dot"/>
      <circle cx="20" cy="5" r="2"  class="dot"/> -->

      <rect x="15" y="0" width="2" height="2" transform="rotate(45 16 1)" class="dot"/>
      <rect x="15" y="10" width="2" height="2" transform="rotate(45 16 11)" class="dot"/>
      <rect x="20" y="5" width="2" height="2" transform="rotate(45 21 6)" class="dot"/>

      <animateTransform
      attributeName="transform"
      type="translate"
      begin="0s"
      dur="2s"
      from="0"
      to="-10"
      repeatCount="indefinite" />
    </g>
  </pattern>
  <rect width="100%" height="100%" fill="url(#dots)"/>
</svg>